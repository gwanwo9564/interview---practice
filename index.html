<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#13263f"><link rel="manifest" href="manifest.webmanifest"><title>항공경영 면접 연습</title><style>
:root{--navy:#13263f;--blue:#2457a7;--line:#dce3ed;--muted:#66758a;--bg:#f4f7fb}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color:#172235}header{background:var(--navy);color:white;padding:20px 18px 24px}header h1{font-size:21px;margin:0 0 6px}header p{margin:0;color:#d4dfef;font-size:13px}main{max-width:760px;margin:auto;padding:16px 14px 36px}.panel{background:white;border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 3px 12px #182e4a0a}.toprow{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:13px}.small{font-size:12px;color:var(--muted)}.pill{font-size:12px;background:#edf3ff;color:#244c91;border-radius:999px;padding:6px 10px;font-weight:700}.track{height:6px;background:#e9edf4;border-radius:99px;overflow:hidden;margin:12px 0 20px}.track div{height:100%;background:var(--blue);transition:width .2s}h2{font-size:19px;line-height:1.55;margin:12px 0 16px}textarea{display:block;width:100%;min-height:170px;resize:vertical;border:1px solid #cbd5e1;border-radius:12px;padding:13px;font:inherit;font-size:16px;line-height:1.6;outline:none}textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px #2457a71a}.buttons{display:flex;gap:8px;margin-top:14px}.btn{border:1px solid #cbd5e1;border-radius:11px;background:white;padding:12px 14px;font:inherit;font-size:14px;font-weight:700;cursor:pointer;color:#172235;flex:1}.btn.primary{background:var(--blue);border-color:var(--blue);color:white}.btn:disabled{opacity:.35;cursor:not-allowed}.quick{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:7px;margin-top:12px}.qbtn{border:1px solid var(--line);background:white;border-radius:9px;padding:9px 0;font-weight:700;cursor:pointer}.qbtn.active{background:var(--navy);color:white}.qbtn.done{border-color:#8cb7a1;background:#edf8f1;color:#20633a}.sectiontitle{font-size:16px;margin:22px 0 10px}.autosave{font-size:12px;color:var(--muted);margin-top:9px;min-height:18px}.review-item{padding:14px 0;border-bottom:1px solid var(--line)}.review-q{font-weight:700;line-height:1.5;margin:6px 0}.review-a{white-space:pre-wrap;line-height:1.6;font-size:14px;margin-top:8px;color:#334155}.empty{color:#9aa5b5;font-style:italic}.review-actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.review-actions .btn{flex:initial}footer{text-align:center;font-size:12px;color:var(--muted);padding:20px}@media(min-width:560px){main{padding-top:22px}.quick{grid-template-columns:repeat(11,minmax(0,1fr))}}
</style></head><body><header><h1>항공경영 면접 연습</h1><p>꼬리질문 22개 · 답변 자동 저장 · 이전 질문으로 돌아가기</p></header><main>
<div id="practice" class="panel"><div class="toprow"><span class="pill" id="number"></span><span class="small" id="status"></span></div><div class="track"><div id="progress"></div></div><div class="small" id="completed"></div><h2 id="question"></h2><textarea id="answer" placeholder="네 생각을 간단히 작성해 봐. 답변은 자동으로 저장돼."></textarea><div class="autosave" id="autosave">이 기기의 브라우저에 답변이 자동 저장됩니다.</div><div class="buttons"><button class="btn" id="prev">← 이전 질문</button><button class="btn primary" id="next">완료 · 다음 질문 →</button></div><h3 class="sectiontitle">질문 바로 이동</h3><div class="quick" id="quick"></div><div class="buttons"><button class="btn" id="reviewBtn">전체 답변 확인</button><button class="btn" id="exportBtn">답변 백업 파일</button></div></div>
<div id="review" class="panel" hidden><div class="toprow"><h2 style="margin:0">전체 답변 확인</h2><span class="pill" id="reviewCount"></span></div><p class="small">질문별 수정 버튼을 누르면 작성 화면으로 돌아갑니다.</p><div class="review-actions"><button class="btn" id="backBtn">← 작성 화면으로</button><button class="btn" id="exportBtn2">답변 백업 파일 저장</button><label class="btn" for="importFile">백업 불러오기</label><input id="importFile" type="file" accept=".json,application/json" hidden></div><div id="reviewList"></div></div>
<footer>답변은 이 기기의 브라우저에 보관됩니다. 브라우저 데이터 삭제 시 사라질 수 있으니 백업 파일도 저장해 두세요.</footer></main>
<script>
const questions=["공항의 효율적인 운영에서 가장 중요하다고 생각하는 요소는 무엇인가요?", "공항의 효율적인 운영을 위해 경영지원팀은 어떤 역할을 해야 한다고 생각하나요?", "공항 운영의 효율성을 높이는 것과 이용객의 편의를 높이는 것이 충돌한다면 무엇을 우선해야 할까요?", "공항의 효율적인 운영을 뒷받침하고 싶다고 했는데, 입사 후 구체적으로 어떤 일을 하고 싶나요?", "공항이 다양한 산업과 경제활동을 연결한다는 말의 구체적인 사례를 들어보세요.", "공항이 새로운 가치를 창출한다는 것은 구체적으로 어떤 의미인가요?", "공항이 국가 경제와 다양한 산업의 발전에 기여한다면, 그 영향이 나타나는 산업에는 무엇이 있나요?", "공항의 운영이 비효율적이라면 어떤 문제가 발생할까요?", "공항이 중요하다는 점은 알겠습니다. 그런데 왜 본인이 직접 공항 경영에 기여하고 싶은 건가요?", "공항의 발전에 기여하고 싶다면 항공운항이나 물류가 아니라 왜 경영관리 분야를 선택했나요?", "공항의 발전을 위해 경영관리 전문가가 할 수 있는 일은 무엇이며, 다른 직무와는 어떤 차이가 있나요?", "다른 대학의 경영학과에서도 공부할 수 있는데, 왜 한국항공대학교 항공경영학과인가요?", "경영학을 주전공으로 하면서 항공경영을 복수전공하려는 이유는 무엇인가요?", "공항경영개론과 공항운영관리론에서 각각 무엇을 배우고 싶나요?", "현장실습학기제에서 어떤 것을 경험하고, 그 경험을 진로에 어떻게 활용하고 싶나요?", "현장실습에서 희망하는 공항 경영지원 업무를 경험하지 못한다면 어떻게 하겠습니까?", "공항이 새로운 기회를 만드는 공간이라고 했는데, 그 기회를 만드는 주체는 공항인가요, 공항을 이용하는 기업인가요?", "공항 운영의 효율성을 높이는 것과 공항의 가치를 높이는 것은 같은 의미인가요? 다르다면 어떻게 다른가요?", "공항이 국가 경제에 기여한다는 점만으로 경영관리 전문가가 되고 싶다는 진로가 충분히 설명된다고 생각하나요?", "비용 절감이 안전이나 서비스 품질을 떨어뜨린다면 어떻게 판단해야 할까요?", "본인이 생각하는 공항의 발전은 공항의 규모가 커지는 것인가요, 아니면 다른 의미인가요?", "공항의 발전에 기여했는지를 어떤 기준으로 판단할 수 있을까요?","공항의 지속적인 발전이란 구체적으로 무엇을 의미한다고 생각하나요?","공항이 지속적으로 발전하기 위해 가장 중요하다고 생각하는 요소는 무엇인가요?","경영관리 업무가 공항의 지속적인 발전에 어떻게 기여할 수 있나요?","공항이 현재의 역할을 넘어 더 큰 가치를 창출한다는 것은 구체적으로 어떤 의미인가요?","공항의 발전이 국가 경제와 다양한 산업의 발전으로 이어지는 이유는 무엇인가요?","공항의 지속적인 발전을 위해 경영관리 전문가가 해결해야 할 과제는 무엇이라고 생각하나요?","공항의 성장과 환경·사회적 책임이 충돌한다면 어떻게 판단해야 한다고 생각하나요?","공항의 지속적인 발전에 기여하기 위해 대학에서 어떤 역량을 갖추고 싶나요?"];const KEY="aviationInterviewPractice_v1";let current=0;let state={answers:Array(questions.length).fill(""),done:Array(questions.length).fill(false)};
try{const s=JSON.parse(localStorage.getItem(KEY)||"null");if(s&&Array.isArray(s.answers)){state.answers=questions.map((_,i)=>String(s.answers[i]||""));state.done=questions.map((_,i)=>Boolean(s.done&&s.done[i]));current=Math.min(questions.length-1,Math.max(0,Number(s.current)||0));}}catch(e){}
const $=id=>document.getElementById(id);function countDone(){return state.done.filter(Boolean).length}function persist(){try{localStorage.setItem(KEY,JSON.stringify({...state,current}));$("autosave").textContent="자동 저장됨 · "+new Date().toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"});}catch(e){$("autosave").textContent="자동 저장을 사용할 수 없습니다. 백업 파일을 저장해 주세요.";}}
function render(){$("number").textContent=`질문 ${current+1} / ${questions.length}`;$("question").textContent=questions[current];$("answer").value=state.answers[current];$("status").textContent=state.done[current]?"완료 표시":"작성 중";$("completed").textContent=`완료 표시 ${countDone()} / ${questions.length}`;$("progress").style.width=(countDone()/questions.length*100)+"%";$("prev").disabled=current===0;$("next").textContent=current===questions.length-1?"완료 · 전체 답변 확인":"완료 · 다음 질문 →";$("quick").innerHTML="";questions.forEach((q,i)=>{const b=document.createElement("button");b.className="qbtn"+(i===current?" active":"")+(state.done[i]?" done":"");b.textContent=i+1;b.onclick=()=>{current=i;persist();render()};$("quick").appendChild(b)});}
$("answer").addEventListener("input",e=>{state.answers[current]=e.target.value;persist()});$("prev").onclick=()=>{if(current>0){current--;persist();render()}};$("next").onclick=()=>{state.done[current]=true;if(current<questions.length-1)current++;else showReview();persist();render()};
function backup(){const d={title:"항공경영 면접 연습 답변 백업",savedAt:new Date().toISOString(),answers:state.answers,done:state.done,current};const blob=new Blob([JSON.stringify(d,null,2)],{type:"application/json"});const u=URL.createObjectURL(blob);const a=document.createElement("a");a.href=u;a.download="항공경영_면접답변_백업.json";a.click();URL.revokeObjectURL(u)}$("exportBtn").onclick=backup;$("exportBtn2").onclick=backup;
function showReview(){$("practice").hidden=true;$("review").hidden=false;$("reviewCount").textContent=`${countDone()} / ${questions.length} 완료`;$("reviewList").innerHTML="";questions.forEach((q,i)=>{const it=document.createElement("div");it.className="review-item";const m=document.createElement("div");m.className="small";m.textContent=`질문 ${i+1} · ${state.done[i]?"완료 표시":"미완료"}`;const t=document.createElement("div");t.className="review-q";t.textContent=q;const a=document.createElement("div");a.className="review-a"+(state.answers[i]?"":" empty");a.textContent=state.answers[i]||"아직 작성한 답변이 없습니다.";const b=document.createElement("button");b.className="btn";b.style.marginTop="10px";b.textContent="이 답변 수정";b.onclick=()=>{current=i;$("review").hidden=true;$("practice").hidden=false;persist();render();scrollTo(0,0)};it.append(m,t,a,b);$("reviewList").append(it)});scrollTo(0,0)}$("reviewBtn").onclick=showReview;$("backBtn").onclick=()=>{$("review").hidden=true;$("practice").hidden=false;render();scrollTo(0,0)};
$("importFile").addEventListener("change",async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(!Array.isArray(d.answers))throw Error();state.answers=questions.map((_,i)=>String(d.answers[i]||""));state.done=questions.map((_,i)=>Boolean(d.done&&d.done[i]));current=Math.min(questions.length-1,Math.max(0,Number(d.current)||0));persist();$("review").hidden=true;$("practice").hidden=false;render();alert("백업 답변을 불러왔습니다.")}catch(err){alert("백업 파일을 읽을 수 없습니다.")}e.target.value=""});render();if("serviceWorker"in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("./sw.js").catch(()=>{});
</script></body></html>
